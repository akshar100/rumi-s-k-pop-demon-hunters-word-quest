<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ff2da5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Rumi's K-Pop Demon Hunters Word Quest</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <style>
    :root {
      --bg-dark: #120726;
      --bg-card: rgba(34, 15, 68, 0.92);
      --pink: #ff2da5;
      --cyan: #00f5d4;
      --gold: #ffbe0b;
      --purple: #9b5de5;
      --text: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #2b1055 0%, #120726 70%);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }
    .app-shell {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 14px 76px;
      position: relative;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 18px;
      padding: 8px 12px;
      backdrop-filter: blur(10px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
    }
    .brand img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1.5px solid var(--cyan);
    }
    .top-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pill-btn {
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.22);
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .pill-btn.active {
      background: var(--pink);
      border-color: #fff;
    }
    .trio-stage {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 10px 0;
    }
    .hero-card {
      background: rgba(255,255,255,0.06);
      border: 2px solid rgba(255,255,255,0.14);
      border-radius: 18px;
      padding: 8px 4px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .hero-card.active {
      transform: translateY(-4px);
      border-color: var(--cyan);
      box-shadow: 0 0 16px rgba(0, 245, 212, 0.45);
      background: rgba(155, 93, 229, 0.25);
    }
    .hero-name {
      font-size: 0.82rem;
      font-weight: 800;
      margin-top: 2px;
    }
    .hero-role {
      font-size: 0.65rem;
      opacity: 0.8;
    }
    .speech-bubble {
      background: linear-gradient(135deg, rgba(255,45,165,0.25), rgba(0,245,212,0.2));
      border: 1.5px solid rgba(0, 245, 212, 0.5);
      border-radius: 14px;
      padding: 8px 12px;
      font-size: 0.88rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 10px;
    }
    .quest-card {
      background: var(--bg-card);
      border: 2px solid rgba(255, 45, 165, 0.45);
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.45);
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
    }
    .category-badge {
      display: inline-block;
      align-self: center;
      background: rgba(0, 245, 212, 0.16);
      color: var(--cyan);
      border: 1px solid var(--cyan);
      border-radius: 999px;
      padding: 3px 12px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
    }
    .emoji-theater {
      font-size: 3.1rem;
      letter-spacing: 8px;
      margin: 10px 0;
      padding: 10px;
      background: rgba(255,255,255,0.05);
      border-radius: 18px;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .emoji-theater:active {
      transform: scale(0.95);
    }
    .sentence-box {
      font-size: 1.35rem;
      line-height: 1.5;
      font-weight: 800;
      margin: 8px 0 14px;
      min-height: 74px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .word-token {
      padding: 2px 5px;
      border-radius: 8px;
      transition: background 0.18s, color 0.18s, transform 0.18s;
    }
    .word-token.reading {
      background: var(--gold);
      color: #120726;
      transform: scale(1.1);
    }
    .blank-slot {
      display: inline-block;
      min-width: 104px;
      padding: 4px 14px;
      border-bottom: 3px dashed var(--cyan);
      background: rgba(0, 245, 212, 0.14);
      border-radius: 12px;
      color: var(--gold);
      font-weight: 900;
    }
    .blank-slot.filled {
      border-bottom: 3px solid var(--gold);
      background: rgba(255, 190, 11, 0.25);
      color: #fff;
    }
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 6px;
    }
    .opt-btn {
      background: linear-gradient(145deg, #2e1660, #1f0d42);
      border: 2px solid rgba(255,255,255,0.25);
      color: #fff;
      border-radius: 16px;
      padding: 14px 10px;
      font-size: 1.15rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.14s, border-color 0.14s, background 0.14s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .opt-btn:active {
      transform: scale(0.96);
    }
    .opt-btn.correct {
      background: linear-gradient(145deg, #06d6a0, #04966f);
      border-color: #fff;
      box-shadow: 0 0 18px rgba(6, 214, 160, 0.7);
    }
    .opt-btn.wrong {
      background: linear-gradient(145deg, #ef476f, #b5173e);
      border-color: #fff;
    }
    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }
    .nav-btn {
      flex: 1;
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.24);
      padding: 11px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 0.92rem;
      cursor: pointer;
    }
    .nav-btn.primary {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      border-color: #fff;
    }
    .share-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(18, 7, 38, 0.96);
      border-top: 1px solid rgba(255,255,255,0.18);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      z-index: 50;
    }
    .share-inner {
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .footer-app-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .footer-app-meta img {
      width: 26px;
      height: 26px;
      border-radius: 6px;
    }
    .footer-btns {
      display: flex;
      gap: 6px;
    }
    .toast {
      position: fixed;
      bottom: 68px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--cyan);
      color: #120726;
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.85rem;
      display: none;
      z-index: 100;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

    <div class="quest-card">
      <div id="categoryBadge" class="category-badge">Stage & Music</div>
      <div id="emojiTheater" class="emoji-theater" onclick="readSentenceAloud(true)" title="Tap to hear sentence clue">🎤🎶✨</div>
      <div id="sentenceBox" class="sentence-box"></div>
      <div id="optionsGrid" class="options-grid"></div>

      <div class="action-row">
        <button class="nav-btn" onclick="prevStage()">◀ Prev</button>

        <button class="nav-btn primary" onclick="nextStage()">Next ▶</button>

  </div>

  <div class="share-footer">
    <div class="share-inner">
      <div class="footer-app-meta">

      </div>

        <button class="pill-btn active" onclick="shareAppLink()">📤 Share Link</button>
        <button class="pill-btn" onclick="copyAppLink()">🔗 Copy</button>
      </div>
    </div>
  </div>

    let currentIndex = parseInt(localStorage.getItem('rumi_stage_idx') || '0', 10);
    if (isNaN(currentIndex) || currentIndex < 0 || currentIndex >= SENTENCES.length) currentIndex = 0;

    let stars = parseInt(localStorage.getItem('rumi_stars') || '0', 10);
    let slowMode = false;
    let activeHero = 'Rumi';
    let solvedCurrent = false;

    const heroLines = {
      Rumi: [
        '🎤 Rumi: "Sing it loud! Pick the right word to power our Starlight!"',
        '💜 Rumi: "Amazing reading! Our K-Pop magic is glowing!"'
      ],
      Mira: [
        '🎧 Mira: "Feel the rhythm! Tap any word button to hear how it sounds!"',
        '⚡ Mira: "Super cool move! You nailed that sentence!"'
      ],
      Zoey: [
        '🌟 Zoey: "Yay! Look at the emojis and fill in the blank!"',
        '💖 Zoey: "Woohoo! Best reader in the galaxy!"'
      ]
    };

    function selectHero(name) {
      activeHero = name;
      document.querySelectorAll('.hero-card').forEach(c => {
        c.classList.toggle('active', c.dataset.hero === name);
      });
      document.getElementById('speechBubble').textContent = heroLines[name][0];
      speakText(name + " is cheering for you!");
    }

    function speakText(text, onWordCallback, onEndCallback) {
      if (!('speechSynthesis' in window)) {
        if (onEndCallback) onEndCallback();
        return;
      }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = slowMode ? 0.72 : 0.95;
      utter.pitch = activeHero === 'Zoey' ? 1.25 : (activeHero === 'Rumi' ? 1.12 : 1.02);
      if (onWordCallback) {
        utter.onboundary = (e) => {
          if (e.name === 'word') onWordCallback(e.charIndex);
        };
      }
      utter.onend = () => {
        if (onEndCallback) onEndCallback();
      };
      window.speechSynthesis.speak(utter);
    }

    function renderStage() {
      solvedCurrent = false;
      const item = SENTENCES[currentIndex];
      document.getElementById('levelBtn').textContent = (currentIndex + 1) + ' / ' + SENTENCES.length;
      document.getElementById('starCount').textContent = stars;
      document.getElementById('categoryBadge').textContent = item.category;
      document.getElementById('emojiTheater').textContent = item.emojis;

      renderSentence(null);

      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';
      item.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerHTML = '🔊 ' + opt;
        btn.onclick = () => handleOptionSelect(opt, btn);
        grid.appendChild(btn);
      });
    }

    function renderSentence(filledWord) {
      const item = SENTENCES[currentIndex];
      const box = document.getElementById('sentenceBox');
      box.innerHTML = '';
      const parts = item.sentence.split('___');
      const leftWords = parts[0].trim().split(/\s+/).filter(Boolean);
      const rightWords = (parts[1] || '').trim().split(/\s+/).filter(Boolean);

      leftWords.forEach(w => {
        const span = document.createElement('span');
        span.className = 'word-token';
        span.textContent = w;
        box.appendChild(span);
      });

      const blank = document.createElement('span');
      blank.className = 'blank-slot word-token' + (filledWord ? ' filled' : '');
      blank.textContent = filledWord ? filledWord : '____';
      box.appendChild(blank);

      rightWords.forEach(w => {
        const span = document.createElement('span');
        span.className = 'word-token';
        span.textContent = w;
        box.appendChild(span);
      });
    }

    function handleOptionSelect(selectedWord, btnElement) {
      const item = SENTENCES[currentIndex];
      if (selectedWord === item.answer) {
        btnElement.classList.add('correct');
        if (!solvedCurrent) {
          solvedCurrent = true;
          stars += 1;
          localStorage.setItem('rumi_stars', stars);
          document.getElementById('starCount').textContent = stars;
        }
        renderSentence(selectedWord);
        document.getElementById('speechBubble').textContent = heroLines[activeHero][1];
        // First read out the selected option, then read out the full completed sentence
        speakText(selectedWord, null, () => {
          setTimeout(() => readSentenceAloud(false), 260);
        });
      } else {
        btnElement.classList.add('wrong');
        speakText(selectedWord);
        document.getElementById('speechBubble').textContent = '✨ Try another word! Tap a button to hear it.';
      }
    }

    function readSentenceAloud(useBlankPause) {
      const item = SENTENCES[currentIndex];
      const fullSentence = item.sentence.replace('___', solvedCurrent || !useBlankPause ? item.answer : 'blank');

      speakText(fullSentence, () => {
        tokens.forEach(t => t.classList.remove('reading'));
        if (tokens[idx]) {
          tokens[idx].classList.add('reading');
          idx++;
        }
      }, () => {
        tokens.forEach(t => t.classList.remove('reading'));
      });
    }

    function nextStage() {
      currentIndex = (currentIndex + 1) % SENTENCES.length;
      localStorage.setItem('rumi_stage_idx', currentIndex);
      renderStage();
    }

    function prevStage() {
      currentIndex = (currentIndex - 1 + SENTENCES.length) % SENTENCES.length;
      localStorage.setItem('rumi_stage_idx', currentIndex);
      renderStage();
    }

    document.getElementById('speedBtn').onclick = () => {
      slowMode = !slowMode;
      const btn = document.getElementById('speedBtn');
      btn.textContent = slowMode ? '🐢 Slow' : '🐇 Normal';
      btn.classList.toggle('active', slowMode);
    };

    document.getElementById('levelBtn').onclick = () => {
      const jump = prompt('Jump to sentence number (1 to 200):', currentIndex + 1);
      const num = parseInt(jump, 10);
      if (!isNaN(num) && num >= 1 && num <= SENTENCES.length) {
        currentIndex = num - 1;
        localStorage.setItem('rumi_stage_idx', currentIndex);
        renderStage();
      }
    };

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2200);
    }

    function shareAppLink() {
      const url = window.location.href;
      if (navigator.share) {
        navigator.share({
          title: "Rumi's K-Pop Demon Hunters Word Quest",
          text: "Play Rumi, Mira & Zoey's 200-Sentence K-Pop Word Reading Game!",
          url: url
        }).catch(() => copyAppLink());
      } else {
        copyAppLink();
      }
    }

    function copyAppLink() {
      const url = window.location.href;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(() => showToast('App Link Copied!'));
      } else {
        showToast('Share URL: ' + url);
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          reg.update();
        }).catch(() => {});
      });
    }

    renderStage();
  </script>
</body>
</html>
